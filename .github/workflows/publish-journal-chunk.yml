name: publish journal chunk
on:
  push:
    paths:
      - ".github/workflows/publish-journal-chunk.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix_b5.py
      - name: commit patched chunk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _next/static/chunks/2djzry4zyjj8w.js
          if git diff --cached --quiet; then
            echo "already patched"
            exit 0
          fi
          git commit -m "Publish the quest journal page."
          git push origin HEAD:main
