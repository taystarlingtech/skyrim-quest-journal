name: publish journal chunk b3
on:
  push:
    paths:
      - ".github/workflows/publish-b3-011.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix_b3_011.py
      - name: commit patched slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-parts/b3/011
          if git diff --cached --quiet; then
            echo "already patched"
            exit 0
          fi
          git commit -m "Publish the quest journal page."
          git push origin HEAD:main
