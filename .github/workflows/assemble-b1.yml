name: assemble b1 chunk
on:
  push:
    paths:
      - ".github/workflows/assemble-b1.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/assemble_b1.py
      - name: commit assembled chunk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _next/static/chunks/0488y5j0fgpsj.js
          if git diff --cached --quiet; then
            echo "already assembled"
            exit 0
          fi
          git commit -m "Publish the quest journal page."
          git push origin HEAD:main
